# Documentation available at https://pwa.spomky-labs.com/
pwa:
    asset_compiler: true
    image_processor: 'pwa.image_processor.imagick'

    favicons:
        enabled: true
        default:
            src: icon/app-icon.svg
            background_color: '#007aff'

    manifest:
        enabled: true
        name: 'Dad Jokes'
        short_name: 'Dad Jokes'
        description: 'A flashcard app for memorizing dad jokes.'
        display: standalone
        theme_color: '#007aff'
        background_color: '#ffffff'
        start_url:
            path: app_start
        # manifest.icons referencing the SVG source directly fails
        # ImagickImageProcessor ("Failed to get the image contents"), even
        # alone with favicons disabled — that pipeline apparently doesn't
        # rasterize SVG the way favicons.default does. Pre-rasterized PNGs
        # (generated once via `php -r '...Imagick...'`, see git history)
        # sidestep it.
        icons:
            - { src: icon/app-icon-192.png, sizes: [192], type: image/png }
            - { src: icon/app-icon-512.png, sizes: [512], type: image/png }

    serviceworker:
        enabled: true
