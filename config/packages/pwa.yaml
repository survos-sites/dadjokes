# Documentation available at https://pwa.spomky-labs.com/
pwa:
    asset_compiler: true

    # Favicons/icon generation needs an image processor, and neither ext-gd
    # nor ext-imagick is available on the Dokku host's PHP build (confirmed
    # via `dokku run dadjokes php -m` — neither extension is present), and
    # locally-available GD can't rasterize SVG anyway ("Data is not in a
    # recognized format"). Left disabled until we either add ext-gd/ext-imagick
    # to composer.json (heroku-buildpack-php installs ext-* requirements) and
    # confirm SVG support, or switch to a pre-rasterized PNG source.
    favicons:
        enabled: false
        default:
            src: icon/app-icon.svg

    manifest:
        enabled: true
        name: 'Dad Jokes'
        short_name: 'Dad Jokes'
        description: 'A flashcard app for memorizing dad jokes.'
        display: standalone
        theme_color: '#007aff'
        background_color: '#ffffff'
        start_url:
            path: app_start
        # No icons: without ext-gd/ext-imagick to generate them (see above),
        # an empty icons array is safer than a manifest pointing at files
        # that don't exist — Chrome's install-prompt heuristics just won't
        # fire without valid icons, which is honest given the current state.

    serviceworker:
        enabled: true
